name: Release APK

# Push a tag such as v1.1 to publish a signed APK as a GitHub Release.
on:
  push:
    tags: ['v*']

# Creating the release needs write access.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Full history: versionCode is the commit count, see below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fails early with a clear message instead of publishing an unsigned APK.
      - name: Decode release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # versionName is the tag without the leading v. versionCode is the
      # number of commits up to the tag: it grows with every release, which
      # Android requires for an update, and does not reset if this file is
      # renamed the way run_number would.
      - name: Build release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(git rev-list --count HEAD)
          ./gradlew assembleRelease --no-daemon \
            -PversionName="$VERSION" -PversionCode="$CODE"
          mv app/build/outputs/apk/release/app-release.apk "tendamf6-$VERSION.apk"

      # Notes come from docs/releases/<tag>.md when it exists, otherwise
      # GitHub generates them from the commits since the previous release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "tendamf6-${GITHUB_REF_NAME#v}.apk" \
            --title "$GITHUB_REF_NAME" "${NOTES_ARGS[@]}"
